<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Machine</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- En-tête façon Google Docs : titre, menus, puis barre d'outils. -->
    <header class="app-header">
      <div class="title-row">
        <span class="logo" data-icon="doc"></span>
        <div class="title-block">
          <div class="title-line">
            <span id="file-name" class="file-name" title="Nom du fichier">Sans titre</span>
            <span id="save-status" class="save-status"></span>
          </div>
          <nav class="menubar" id="menubar" aria-label="Menus"></nav>
        </div>
      </div>
      <div class="toolbar" id="toolbar" role="toolbar">
        <button data-action="find" data-icon="search" title="Rechercher et remplacer (⌘F)"></button>
        <button data-action="undo" data-icon="undo" title="Annuler (⌘Z)"></button>
        <button data-action="redo" data-icon="redo" title="Rétablir (⇧⌘Z)"></button>
        <button data-action="print" data-icon="print" title="Imprimer (⌘P)"></button>
        <button data-action="spellcheck" data-icon="spellcheck" title="Correcteur orthographique"></button>
        <select id="zoom" title="Zoom">
          <option value="0.5">50 %</option>
          <option value="0.75">75 %</option>
          <option value="0.9">90 %</option>
          <option value="1" selected>100 %</option>
          <option value="1.25">125 %</option>
          <option value="1.5">150 %</option>
          <option value="2">200 %</option>
        </select>
        <span class="sep"></span>
        <select id="block-style" class="wide" title="Style (paragraphe ou caractère)">
          <option value="p">Texte normal</option>
          <option value="1">Titre</option>
          <option value="2">Titre 1</option>
          <option value="3">Titre 2</option>
          <option value="4">Titre 3</option>
        </select>
        <span class="sep"></span>
        <button type="button" id="font-button" class="font-button" title="Police"><span id="font-name">Georgia</span><span class="arrow">▾</span></button>
        <span class="sep"></span>
        <span class="font-size" title="Taille du texte">
          <button data-action="sizeDown" data-icon="minus" title="Diminuer la taille (⇧⌘,)"></button>
          <input id="font-size" type="text" inputmode="decimal" autocomplete="off" />
          <button data-action="sizeUp" data-icon="plus" title="Augmenter la taille (⇧⌘.)"></button>
        </span>
        <span class="sep"></span>
        <button data-action="bold" data-icon="bold" title="Gras (⌘B)"></button>
        <button data-action="italic" data-icon="italic" title="Italique (⌘I)"></button>
        <button data-action="underline" data-icon="underline" title="Souligné (⌘U)"></button>
        <label class="color" title="Couleur du texte">
          <span data-icon="textColor"></span>
          <input type="color" id="text-color" value="#c0392b" />
        </label>
        <label class="color" title="Couleur de surlignage">
          <span data-icon="highlight"></span>
          <input type="color" id="highlight-color" value="#fff3a3" />
        </label>
        <span class="sep"></span>
        <button data-action="link" data-icon="link" title="Insérer un lien (⌘K)"></button>
        <button data-action="image" data-icon="image" title="Insérer une image (ou collez-la avec ⌘V)"></button>
        <button data-action="table" data-icon="table" title="Insérer un tableau"></button>
        <span class="sep"></span>
        <button data-action="alignLeft" data-icon="alignLeft" title="Aligner à gauche (⇧⌘L)"></button>
        <button data-action="alignCenter" data-icon="alignCenter" title="Centrer (⇧⌘E)"></button>
        <button data-action="alignRight" data-icon="alignRight" title="Aligner à droite (⇧⌘R)"></button>
        <button data-action="alignJustify" data-icon="alignJustify" title="Justifier (⇧⌘J)"></button>
        <button data-action="lineHeight" data-icon="lineHeight" title="Interligne et espacement"></button>
        <span class="sep"></span>
        <button data-action="taskList" data-icon="checklist" title="Liste de cases à cocher (⇧⌘9)"></button>
        <button data-action="bulletList" data-icon="bulletList" title="Liste à puces (⇧⌘8)"></button>
        <button data-action="orderedList" data-icon="orderedList" title="Liste numérotée (⇧⌘7)"></button>
        <button data-action="outdent" data-icon="outdent" title="Diminuer le retrait (⇧Tab)"></button>
        <button data-action="indent" data-icon="indent" title="Augmenter le retrait (Tab)"></button>
        <button data-action="clearFormat" data-icon="clearFormat" title="Effacer la mise en forme (⌘\)"></button>
        <span class="group" id="table-tools" hidden>
          <span class="sep"></span>
          <button data-action="rowAfter" class="text" title="Insérer une ligne en dessous">+ Ligne</button>
          <button data-action="colAfter" class="text" title="Insérer une colonne à droite">+ Colonne</button>
          <button data-action="tableMenu" class="text" title="Autres actions sur le tableau">Tableau ▾</button>
        </span>
        <input type="file" id="image-file" accept="image/*" hidden />
      </div>
    </header>

    <div class="find-bar" id="find-bar" hidden>
      <input id="find-input" placeholder="Rechercher dans l'onglet" />
      <span id="find-count"></span>
      <button data-find="prev" title="Précédent (⇧Entrée)">↑</button>
      <button data-find="next" title="Suivant (Entrée)">↓</button>
      <label class="inline"><input type="checkbox" id="find-case" /> Respecter la casse</label>
      <input id="replace-input" placeholder="Remplacer par" />
      <button data-find="replace">Remplacer</button>
      <button data-find="replaceAll">Tout remplacer</button>
      <button data-find="close" data-icon="close" title="Fermer (Échap)"></button>
    </div>

    <div class="workspace">
      <!-- Panneau de gauche : onglets du document et plan de l'onglet ouvert. -->
      <aside class="side-panel" id="side-panel">
        <div class="panel-head">
          <button class="round" data-panel="hide" data-icon="back" title="Masquer les onglets et le plan (⇧⌘O)"></button>
        </div>
        <div class="panel-title">
          <h2>Onglets du document</h2>
          <button class="round" data-panel="add" data-icon="plus" title="Ajouter un onglet"></button>
        </div>
        <ul class="tab-tree" id="tab-tree" role="tree"></ul>
      </aside>
      <button class="panel-show" id="panel-show" data-icon="panel" title="Afficher les onglets et le plan (⇧⌘O)" hidden></button>

      <main class="desk" id="desk">
        <div class="paper" id="paper">
          <div class="sheets" id="sheets" aria-hidden="true"></div>
          <div id="editor"></div>
        </div>
      </main>
    </div>

    <!-- Nombre de mots pendant la saisie (Outils > Nombre de mots). -->
    <button class="word-box" id="word-box" title="Nombre de mots (⇧⌘C)" hidden></button>

    <dialog id="link-dialog">
      <form method="dialog">
        <label>Adresse du lien
          <input type="text" id="link-url" autocomplete="off" placeholder="https://exemple.fr" />
        </label>
        <menu>
          <button value="remove" type="submit" formnovalidate>Retirer le lien</button>
          <button value="cancel" type="submit" formnovalidate>Annuler</button>
          <button value="ok" type="submit" class="primary">Appliquer</button>
        </menu>
      </form>
    </dialog>

    <dialog id="page-dialog">
      <form method="dialog" class="page-form" novalidate>
        <h2>Mise en page</h2>
        <fieldset>
          <legend>Affichage</legend>
          <label class="inline"><input type="radio" name="mode" value="pages" /> Pages</label>
          <label class="inline"><input type="radio" name="mode" value="pageless" /> Sans pagination (défilement continu)</label>
        </fieldset>
        <label>Format
          <select name="size">
            <option value="A4">A4 (21 × 29,7 cm)</option>
            <option value="Letter">Lettre US (21,6 × 27,9 cm)</option>
          </select>
        </label>
        <fieldset>
          <legend>Orientation</legend>
          <label class="inline"><input type="radio" name="orientation" value="portrait" /> Portrait</label>
          <label class="inline"><input type="radio" name="orientation" value="landscape" /> Paysage</label>
        </fieldset>
        <fieldset class="margins">
          <legend>Marges (cm)</legend>
          <label>Haut <input type="number" name="top" min="0" max="10" step="any" inputmode="decimal" /></label>
          <label>Bas <input type="number" name="bottom" min="0" max="10" step="any" inputmode="decimal" /></label>
          <label>Gauche <input type="number" name="left" min="0" max="10" step="any" inputmode="decimal" /></label>
          <label>Droite <input type="number" name="right" min="0" max="10" step="any" inputmode="decimal" /></label>
        </fieldset>
        <label class="inline"><input type="checkbox" name="pageNumbers" /> Numéros de page</label>
        <menu>
          <button value="cancel" type="submit" formnovalidate>Annuler</button>
          <button value="ok" type="submit" class="primary">OK</button>
        </menu>
      </form>
    </dialog>

    <dialog id="styles-dialog" class="styles-dialog">
      <form method="dialog">
        <h2>Styles</h2>
        <p class="hint">Modifiez un style : tout le texte de ce style change, dans tous les onglets.</p>
        <div class="styles-layout">
          <div class="style-side">
            <ul class="style-list" id="style-list"></ul>
            <div class="style-add">
              <button type="button" id="style-new-para" class="link-button">+ Nouveau style de paragraphe</button>
              <button type="button" id="style-new-char" class="link-button">+ Nouveau style de caractère</button>
            </div>
          </div>
          <div class="style-form" id="style-form">
            <label id="style-name-row">Nom du style
              <input type="text" name="name" autocomplete="off" />
            </label>
            <fieldset>
              <legend>Caractères</legend>
              <div class="row">
                <div class="field grow">
                  <span class="field-label">Police</span>
                  <span class="font-field-row">
                    <button type="button" id="style-font" class="font-field"><span id="style-font-name"></span><span class="arrow">▾</span></button>
                    <button type="button" id="style-font-inherit" class="link-button" title="Ne pas choisir de police pour ce style">Aucune</button>
                  </span>
                </div>
                <label>Graisse <select name="fontWeight"></select></label>
              </div>
              <div class="row">
                <label>Taille (pt) <input type="number" name="fontSize" min="6" max="96" step="0.5" /></label>
                <label>Couleur <input type="color" name="color" /></label>
                <div class="field">
                  <span class="field-label">Surlignage</span>
                  <span class="opt-color">
                    <input type="checkbox" name="hasHighlight" title="Surligner" />
                    <input type="color" name="highlight" value="#fff3a3" />
                  </span>
                </div>
              </div>
              <div class="row checks">
                <label class="inline"><input type="checkbox" name="italic" /> <i>Italique</i></label>
                <label class="inline"><input type="checkbox" name="underline" /> <u>Souligné</u></label>
                <label class="inline"><input type="checkbox" name="strike" /> <s>Barré</s></label>
                <label class="inline"><input type="checkbox" name="smallCaps" /> <span style="font-variant-caps: small-caps">Petites capitales</span></label>
              </div>
              <div class="row">
                <label>Position
                  <select name="verticalAlign">
                    <option value="">Normale</option>
                    <option value="super">Exposant</option>
                    <option value="sub">Indice</option>
                  </select>
                </label>
                <label>Casse
                  <select name="textTransform">
                    <option value="">Telle que saisie</option>
                    <option value="uppercase">MAJUSCULES</option>
                    <option value="lowercase">minuscules</option>
                    <option value="capitalize">Initiales En Capitales</option>
                  </select>
                </label>
                <label>Espacement des lettres (pt) <input type="number" name="letterSpacing" min="-5" max="20" step="0.1" /></label>
              </div>
            </fieldset>
            <fieldset id="style-paragraph">
              <legend>Paragraphe</legend>
              <div class="row">
                <label>Alignement
                  <select name="textAlign">
                    <option value="">À gauche</option>
                    <option value="center">Centré</option>
                    <option value="right">À droite</option>
                    <option value="justify">Justifié</option>
                  </select>
                </label>
                <label>Interligne
                  <select name="lineHeight">
                    <option value="1">Simple</option>
                    <option value="1.15">1,15</option>
                    <option value="1.25">1,25</option>
                    <option value="1.5">1,5</option>
                    <option value="2">Double</option>
                  </select>
                </label>
              </div>
              <div class="row">
                <label>Espace avant (pt) <input type="number" name="spaceBefore" min="0" max="96" step="1" /></label>
                <label>Espace après (pt) <input type="number" name="spaceAfter" min="0" max="96" step="1" /></label>
              </div>
              <div class="row">
                <label>Retrait à gauche (cm) <input type="number" name="indentLeft" min="0" max="15" step="0.25" /></label>
                <label>Retrait à droite (cm) <input type="number" name="indentRight" min="0" max="15" step="0.25" /></label>
                <label title="Négatif : retrait suspendu">Première ligne (cm) <input type="number" name="firstLineIndent" min="-10" max="10" step="0.25" /></label>
              </div>
            </fieldset>
            <button type="button" id="style-reset" class="link-button">Revenir à la valeur d'origine de ce style</button>
            <button type="button" id="style-delete" class="link-button danger">Supprimer ce style</button>
          </div>
        </div>
        <menu>
          <button type="button" id="styles-save-default" title="Les nouveaux documents utiliseront ces styles">Enregistrer comme styles par défaut</button>
          <button value="ok" type="submit" class="primary">Fermer</button>
        </menu>
      </form>
    </dialog>

    <dialog id="count-dialog" class="count-dialog">
      <form method="dialog">
        <h2>Nombre de mots</h2>
        <table id="count-table"></table>
        <label class="inline"><input type="checkbox" id="count-live" /> Afficher le nombre de mots pendant la saisie</label>
        <menu>
          <button value="ok" type="submit" class="primary">OK</button>
        </menu>
      </form>
    </dialog>

    <dialog id="rename-dialog">
      <form method="dialog">
        <label>Nom de l'onglet
          <input type="text" id="rename-input" autocomplete="off" />
        </label>
        <menu>
          <button value="cancel" type="submit" formnovalidate>Annuler</button>
          <button value="ok" type="submit" class="primary">OK</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
