[package]
name = "text-machine"
description = "Text Machine : un traitement de texte local."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# Nom distinct du binaire, nécessaire pour Tauri.
name = "text_machine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde.workspace = true
serde_json.workspace = true
tm-model.workspace = true
tm-io-native.workspace = true
tm-io-markdown.workspace = true
tm-io-docx.workspace = true
base64 = "0.23"
ttf-parser = "0.25"


# Export PDF direct sur Mac (mêmes versions que celles de Tauri).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSError", "NSObject"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFURL", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGContext", "CGDataProvider", "CGPDFContext", "CGPDFDocument", "CGPDFPage"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKWebView", "WKPDFConfiguration"] }

# Export PDF direct sur Windows (mêmes versions que celles de Tauri).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
