[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tm-model = { path = "crates/tm-model" }
tm-ops = { path = "crates/tm-ops" }
tm-io-native = { path = "crates/tm-io-native" }
tm-io-markdown = { path = "crates/tm-io-markdown" }
