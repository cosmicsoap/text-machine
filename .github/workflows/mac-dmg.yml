# Fabrique l'application Mac (.dmg) automatiquement sur les serveurs de GitHub.
#
# - À chaque modification de la branche main : le .dmg est publié dans la
#   page « Releases » du dépôt, sous le nom « Dernière version ».
# - Sur une pull request : le .dmg est seulement fabriqué (pour vérifier que
#   tout marche) et rangé dans l'onglet « Actions ».
# - On peut aussi le relancer à la main : onglet Actions > « Application Mac »
#   > « Run workflow ».
name: Application Mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Une seule application qui marche sur les Mac Apple (M1, M2…) et Intel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Installer les dépendances web
        working-directory: app
        run: npm ci

      - name: Fabriquer l'application
        working-directory: app
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Renommer le .dmg
        run: |
          dmg=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)
          test -n "$dmg"
          mv "$dmg" Text-Machine-mac.dmg
          ls -lh Text-Machine-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Text-Machine-mac
          path: Text-Machine-mac.dmg

      - name: Publier dans « Releases »
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version Text-Machine-mac.dmg \
            --target "$GITHUB_SHA" \
            --title "Dernière version" \
            --latest \
            --notes "Application Mac fabriquée automatiquement à partir du commit ${GITHUB_SHA::7}.

          Fonctionne sur les Mac Apple (M1, M2…) et Intel.

          L'application n'est pas signée par Apple : la première fois, macOS refuse de l'ouvrir. Voir « Installer l'application sur Mac » dans le README."
